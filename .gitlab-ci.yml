# Lance la suite de tests à chaque poussée sur main et sur chaque merge request.
#
# Pour que ce pipeline s'exécute, CI/CD doit être activé :
# Settings → General → Visibility, project features, permissions → CI/CD → Everyone With Access.
# Tant qu'il est désactivé, les badges pipeline et couverture du README affichent une image cassée.
#
# --ignore-scripts saute le postinstall : ni Chromium ni hooks git ne sont utiles ici,
# les tests ne touchent ni au réseau ni au navigateur.

default:
  image: node:22-alpine
  interruptible: true

stages:
  - test

tests:
  stage: test
  script:
    - npm ci --ignore-scripts
    - npm run test:ci
  # Alimente le badge de couverture : dernière ligne du rapport de node --test
  coverage: '/all files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
