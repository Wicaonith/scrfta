<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ScrFta – cible en lignes de tableau">
  <title>ScrFta — cible dont les anneaux sont des lignes de tableau</title>
  <rect width="256" height="256" rx="56" fill="#12385F"/>

  <defs>
    <clipPath id="disque">
      <circle cx="128" cy="128" r="90"/>
    </clipPath>
  </defs>

  <!-- lignes de tableau dans le disque -->
  <g clip-path="url(#disque)">
    <rect x="38" y="38" width="180" height="180" fill="#FFFFFF"/>
    <rect x="38" y="38" width="180" height="30" fill="#9FBBD6"/>
    <rect x="38" y="98" width="180" height="26" fill="#E3EAF2"/>
    <rect x="38" y="150" width="180" height="26" fill="#E3EAF2"/>
    <rect x="38" y="118" width="180" height="24" fill="#F2B705"/>
    <!-- séparateurs de colonnes -->
    <g fill="#C3D0DE">
      <rect x="96" y="68" width="3" height="150"/>
      <rect x="158" y="68" width="3" height="150"/>
    </g>
  </g>

  <!-- anneaux -->
  <g fill="none" stroke="#12385F" stroke-width="7">
    <circle cx="128" cy="128" r="90"/>
    <circle cx="128" cy="128" r="60"/>
    <circle cx="128" cy="128" r="30"/>
  </g>
</svg>
