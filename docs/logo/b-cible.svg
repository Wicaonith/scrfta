<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ScrFta – cible et flèche">
  <title>ScrFta — cible et flèche</title>
  <rect width="256" height="256" rx="56" fill="#12385F"/>

  <!-- cible -->
  <circle cx="122" cy="134" r="88" fill="#FFFFFF"/>
  <circle cx="122" cy="134" r="60" fill="#2E77C4"/>
  <circle cx="122" cy="134" r="32" fill="#F2B705"/>

  <!-- flèche plantée, contour blanc pour rester lisible sur tous les anneaux -->
  <g transform="translate(130,126) rotate(135)">
    <g fill="#12385F" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">
      <polygon points="0,0 -32,-17 -32,17"/>
      <rect x="-124" y="-6.5" width="96" height="13" rx="6.5"/>
      <polygon points="-124,-6 -104,-6 -116,-26 -136,-26"/>
      <polygon points="-124,6 -104,6 -116,26 -136,26"/>
    </g>
  </g>
</svg>
