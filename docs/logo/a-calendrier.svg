<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ScrFta – calendrier et flèche">
  <title>ScrFta — calendrier et flèche</title>
  <rect width="256" height="256" rx="56" fill="#12385F"/>

  <!-- anneaux du calendrier -->
  <rect x="84" y="40" width="15" height="34" rx="7.5" fill="#FFFFFF"/>
  <rect x="157" y="40" width="15" height="34" rx="7.5" fill="#FFFFFF"/>

  <!-- page -->
  <rect x="44" y="56" width="168" height="158" rx="22" fill="#FFFFFF"/>
  <path d="M66 56 H190 A22 22 0 0 1 212 78 V98 H44 V78 A22 22 0 0 1 66 56 Z" fill="#9FBBD6"/>

  <!-- lignes de calendrier -->
  <g fill="#CBD8E5">
    <circle cx="78" cy="188" r="9"/>
    <circle cx="112" cy="188" r="9"/>
    <circle cx="146" cy="188" r="9"/>
  </g>

  <!-- flèche plantée, en diagonale sur toute la page -->
  <g transform="translate(84,186) rotate(135)">
    <g fill="#F2B705" stroke="#12385F" stroke-width="6" stroke-linejoin="round">
      <polygon points="0,0 -34,-18 -34,18"/>
      <rect x="-146" y="-7" width="118" height="14" rx="7"/>
      <polygon points="-146,-7 -122,-7 -136,-30 -160,-30"/>
      <polygon points="-146,7 -122,7 -136,30 -160,30"/>
    </g>
  </g>
</svg>
